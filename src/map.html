<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>ChadScanner raid map</title>
  <style>
    /*LEAFLET_CSS*/
  </style>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #111;
      overflow: hidden;
      font: 13px/1.3 "Segoe UI", sans-serif;
    }

    #map {
      position: absolute;
      inset: 0;
      background: #111;
    }

    #bar {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      padding: 8px 12px;
      background: rgba(20, 20, 20, .85);
      color: #f2f2f2;
      border: 1px solid #444;
      border-radius: 4px;
    }

    #title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    #bar label {
      display: block;
      cursor: pointer;
      user-select: none;
    }

    #bar input {
      vertical-align: middle;
      margin: 0 6px 0 0;
    }

    #mineRow {
      display: none;
    }

    .leaflet-container {
      background: #111;
    }

    .ex {
      background: rgba(20, 20, 20, .85);
      border: 1px solid #444;
      color: #f2f2f2;
      font-weight: 600;
      box-shadow: none;
    }

    .ex.leaflet-tooltip-top::before {
      border-top-color: #444;
    }

    .me-wrap {
      background: none;
      border: none;
    }

    .me {
      width: 0;
      height: 0;
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      border-bottom: 22px solid #ffd400;
      filter: drop-shadow(0 0 2px #000);
      transform-origin: 50% 50%;
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <div id="bar">
    <div id="title">Raid map</div>
    <label><input type="checkbox" id="optSpawns" checked>PMC spawns</label>
    <label><input type="checkbox" id="optExtracts" checked>PMC extracts</label>
    <label id="mineRow"><input type="checkbox" id="optMine" checked>Only my extracts</label>
  </div>
  <script>/*LEAFLET_JS*/</script>
  <script>
    (function () {
      'use strict';
      // Layer options live here, not in localStorage (this page has an opaque origin); they outlive every show().
      var opts = {spawns: true, extracts: true, mine: true};
      var COLORS = {pmc: '#00e599', shared: '#00e4e5', scav: '#ff7800'};
      var map = null, view = null, mine = null, me = null, spawnLayer = null, extractLayer = null;
      var $ = function (id) {return document.getElementById(id);};

      // tarkov.dev's projection (src/pages/map/index.jsx).
      function applyRotation(ll, r) {
        if (!ll.lat && !ll.lng) return L.latLng(0, 0);
        if (!r) return ll;
        var a = r * Math.PI / 180, x = ll.lng, y = ll.lat;
        return L.latLng(x * Math.sin(a) + y * Math.cos(a), x * Math.cos(a) - y * Math.sin(a));
      }
      function getCRS(m) {
        return L.extend({}, L.CRS.Simple, {
          transformation: new L.Transformation(m.transform[0], m.transform[1], m.transform[2] * -1, m.transform[3]),
          projection: L.extend({}, L.Projection.LonLat, {
            project: function (ll) {return L.Projection.LonLat.project(applyRotation(ll, m.coordinateRotation));},
            unproject: function (p) {return applyRotation(L.Projection.LonLat.unproject(p), m.coordinateRotation * -1);}
          })
        });
      }
      function getBounds(b) {return L.latLngBounds([b[0][1], b[0][0]], [b[1][1], b[1][0]]);}

      function renderBar() {
        var text = view ? view.name : 'Raid map';
        if (view && mine && opts.mine) text += ' \u2013 ' + mine.length + ' of your extracts';
        $('title').textContent = text;
        $('mineRow').style.display = mine ? 'block' : 'none';
      }

      function renderExtracts() {
        if (!map || !view) return;
        extractLayer.clearLayers();
        var only = mine && opts.mine;
        view.extracts.forEach(function (e) {
          var wanted = only ? mine.indexOf(e.name) >= 0 : (e.faction === 'pmc' || e.faction === 'shared');
          if (!wanted) return;
          var color = COLORS[e.faction] || COLORS.shared;
          L.circleMarker(e.pos, {radius: 8, color: color, fillColor: color, fillOpacity: .5})
            .bindTooltip(e.name, {permanent: true, direction: 'top', className: 'ex'})
            .addTo(extractLayer);
        });
      }

      function syncLayers() {
        if (!map) return;
        [[spawnLayer, opts.spawns], [extractLayer, opts.extracts]].forEach(function (p) {
          var on = map.hasLayer(p[0]);
          if (p[1] && !on) map.addLayer(p[0]);
          if (!p[1] && on) map.removeLayer(p[0]);
        });
      }

      window.__map = {
        show: function (v) {
          view = v; mine = null;
          if (map) map.remove();
          me = null;
          var c = v.config;
          var maxZoom = Math.max(7, c.maxZoom);
          map = L.map('map', {crs: getCRS(c), minZoom: c.minZoom, maxZoom: maxZoom, zoomSnap: 0.5, zoomControl: false, attributionControl: false});
          L.control.zoom({position: 'topright'}).addTo(map);
          var bounds = getBounds(c.bounds);
          if (c.tilePath) {
            L.tileLayer(c.tilePath, {tileSize: c.tileSize, bounds: bounds, maxNativeZoom: c.maxZoom, maxZoom: maxZoom}).addTo(map);
          } else if (c.svgPath) {
            L.imageOverlay(c.svgPath, bounds).addTo(map);
          }
          map.fitBounds(bounds);
          spawnLayer = L.layerGroup();
          v.spawns.forEach(function (s) {
            if (!bounds.contains(L.latLng(s))) return;
            L.circleMarker(s, {radius: 5, color: COLORS.pmc, fillColor: COLORS.pmc, fillOpacity: .6}).addTo(spawnLayer);
          });
          extractLayer = L.layerGroup();
          renderExtracts();
          syncLayers();
          renderBar();
        },
        only: function (names) {
          mine = names;
          renderExtracts();
          renderBar();
        },
        // A screenshot's position: an arrow at the spot, turned to face the way the player does. tarkov.dev's rule for the rotation.
        here: function (p) {
          if (!map || !view) return;
          var r = view.config.coordinateRotation || 0;
          if (r === 90 || r === 270) r += 180;
          var icon = L.divIcon({
            className: 'me-wrap',
            html: '<div class="me" style="rotate:' + (p.yaw + r) + 'deg"></div>',
            iconSize: [18, 22],
            iconAnchor: [9, 11]
          });
          if (me) me.setLatLng(p.pos).setIcon(icon);
          else me = L.marker(p.pos, {icon: icon, zIndexOffset: 1000, interactive: false}).addTo(map);
          map.panTo(p.pos);
        }
      };

      [['optSpawns', 'spawns'], ['optExtracts', 'extracts'], ['optMine', 'mine']].forEach(function (p) {
        $(p[0]).addEventListener('change', function (ev) {
          opts[p[1]] = ev.target.checked;
          renderExtracts();
          syncLayers();
          renderBar();
        });
      });

      // Tells the app the page is up: scripts it sent before this ran would have hit an empty document.
      if (window.ipc) window.ipc.postMessage('map-ready');
    })();
  </script>
</body>

</html>
