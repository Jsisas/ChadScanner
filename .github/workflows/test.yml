name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: ChadScanner

      # Keeps the `../ChadVision` path dependency working.
      - uses: actions/checkout@v4
        with:
          repository: Jsisas/ChadVision
          ref: main
          path: ChadVision

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ChadScanner -> target
            ChadVision -> target

      - name: cargo test
        working-directory: ChadScanner
        run: cargo test

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Site JS tests
        run: node --test site/main.test.js
      - name: Stage site
        run: |
          tools/build-site.sh /tmp/o
          for f in index.html style.css main.js icon.svg icon-32.png icon-256.png; do test -f "/tmp/o/$f"; done
          test ! -e /tmp/o/main.test.js
